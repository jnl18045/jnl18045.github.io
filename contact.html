<!DOCTYPE html>

<html lang="en">

<body>

    <nav>
        <a href="index.html">Home</a>

<main id="main-content">

    <h2>Contact Blind Date with a Book</h2>

    <p>
        Have a question about our books or need help finding your next
        reading adventure? Fill out the form below and let us know how
        we can help.
    </p>

    <form class="contact-form" action="mailto:jnl18045@example.com" method="post" enctype="text/plain">

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="genre">Preferred Genre</label>
        <select id="genre" name="genre" required>
            <option value="">Select a genre</option>
            <option value="fiction">Fiction</option>
            <option value="romance">Romance</option>
            <option value="mystery">Mystery</option>
            <option value="fantasy">Fantasy</option>
            <option value="science-fiction">Science Fiction</option>
            <option value="horror">Horror</option>
            <option value="young-adult">Young Adult</option>
            <option value="nonfiction">Nonfiction</option>
            <option value="surprise-me">Surprise Me</option>
        </select>

        <label for="length">Preferred Book Length</label>
        <select id="length" name="length" required>
            <option value="">Select a length</option>
            <option value="short">Short</option>
            <option value="medium">Medium</option>
            <option value="long">Long</option>
            <option value="any">Any Length</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send My Book Question</button>

    </form>

</main>

<footer>
    <p>&copy; 2026 Blind Date with a Book</p>
</footer>

</body>

</html>
